<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dots and Boxes — Babe Games</title>
<link rel="manifest" href="../manifest.json" />
<meta name="theme-color" content="#1a1025" />
<link rel="icon" href="../icons/icon-192.png" />
<link rel="apple-touch-icon" href="../icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="wrap">
  <header class="site-header">
    <div class="logo"><a href="../index.html">Babe <span>Games</span></a></div>
    <div class="header-widgets">
      <nav class="crumbs"><a href="../index.html">&larr; All games</a></nav>
      <div id="notify-widget"></div>
      <div id="profile-widget"></div>
    </div>
  </header>

  <div class="game-shell">
    <h2 style="margin-top:0;">&#128209; Dots and Boxes</h2>

    <details class="rules">
      <summary>How to play</summary>
      Take turns drawing one line between two dots. Close the fourth side of
      a box and it's yours &mdash; and you go again. When the grid is full,
      whoever owns the most boxes wins.
    </details>

    <div id="online-bar" class="online-bar" style="display:none;"></div>

    <div id="setup-screen">
      <div class="field">
        <label for="p1-name">Your name</label>
        <input type="text" id="p1-name" placeholder="Player 1" />
      </div>
      <div class="field" id="p2-field">
        <label for="p2-name">Opponent name (same device)</label>
        <input type="text" id="p2-name" placeholder="Player 2" />
      </div>
      <div class="field">
        <label for="grid-size">Grid size</label>
        <select id="grid-size">
          <option value="3" selected>3 &times; 3 boxes</option>
          <option value="4">4 &times; 4 boxes</option>
          <option value="5">5 &times; 5 boxes</option>
        </select>
      </div>
      <div class="field">
        <label for="turn-time">Time per move</label>
        <select id="turn-time">
          <option value="0" selected>No timer</option>
          <option value="15">15 seconds</option>
          <option value="20">20 seconds</option>
          <option value="30">30 seconds</option>
        </select>
      </div>
      <div class="btn-row">
        <button class="btn" id="start-local">Start (same device)</button>
        <button class="btn secondary" id="start-online">&#127760; Play Online</button>
      </div>
    </div>

    <div id="play-screen" style="display:none;">
      <div class="seat-row">
        <div class="seat" id="seat-0">
          <div class="seat-name"></div>
          <div class="seat-score">0</div>
          <div class="seat-sub">boxes</div>
        </div>
        <div class="seat" id="seat-1">
          <div class="seat-name"></div>
          <div class="seat-score">0</div>
          <div class="seat-sub">boxes</div>
        </div>
      </div>
      <div class="turn-banner" id="turn-banner"></div>
      <div class="timer" id="timer-display" style="display:none;">00:00</div>
      <div class="dab-stage" id="board-stage"></div>
      <div class="feedback" id="feedback"></div>
    </div>

    <div id="end-screen" style="display:none;">
      <h3 id="winner-line" class="result-title"></h3>
      <p id="result-subtitle" class="result-subtitle"></p>
      <div class="seat-row">
        <div class="seat" id="final-0">
          <div class="seat-name"></div>
          <div class="seat-score">0</div>
          <div class="seat-sub">boxes</div>
        </div>
        <div class="seat" id="final-1">
          <div class="seat-name"></div>
          <div class="seat-score">0</div>
          <div class="seat-sub">boxes</div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn" id="rematch-btn">Play Again</button>
        <a class="btn secondary" href="../index.html">Back to games</a>
      </div>
    </div>
  </div>
</div>

<script src="../js/common.js"></script>
<script src="../js/celebrate.js"></script>
<script src="../js/data.js"></script>
<script src="../js/profiles.js"></script>
<script src="../js/notify.js"></script>
<script>BabeNotify.init("../");</script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="../js/online.js"></script>
<script src="../js/rules/dots-rules.js"></script>
<script src="../js/game.js"></script>
<script src="../js/game-ui.js"></script>
<script src="dots-and-boxes.js"></script>
</body>
</html>
